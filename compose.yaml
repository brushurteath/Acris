services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_ORIGIN: https://your-domain.example
      COOKIE_SECURE: "1"
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/data
    volumes:
      - acris-data:/app/data
volumes:
  acris-data:
